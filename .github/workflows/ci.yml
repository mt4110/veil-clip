name: RustとCLIの検証 / Rust and CLI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: ソース取得 / Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 開発ツール導入 / Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.1.4
          cache: false
      - name: Rust検査コンポーネント導入 / Install Rust check components
        run: mise exec -- rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy
      - name: コア・CLI検証 / Check core and CLI
        run: mise run check
      - name: 依存監査 / Audit dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: mise run audit
